<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bondade ou Boazinha? · Quiz da Célula</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#21134f;--ink:#fff9ee;--yellow:#ffd64f;--deep:#21134f;--muted:#d6ccef;--tone:#6a40db;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid var(--yellow);outline-offset:4px}.app{height:100dvh;min-height:600px;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 90% 0%,#ffffff15,transparent 32%),var(--bg);color:var(--ink);transition:background .35s}.app[data-tone="yellow"]{--bg:#ffd64f;--ink:#201547;--muted:#4e3a68;--tone:#ffd64f}.app[data-tone="blue"]{--bg:#27bae4;--ink:#0b234a;--muted:#21445d;--tone:#27bae4}.app[data-tone="orange"]{--bg:#ff9044;--ink:#311704;--muted:#65360e;--tone:#ff9044}.app[data-tone="green"]{--bg:#34d583;--ink:#062c20;--muted:#235240;--tone:#34d583}.app[data-tone="pink"]{--bg:#d71562;--ink:#fff9ee;--muted:#f7cee0;--tone:#d71562}.app[data-tone="purple"]{--bg:#693de2;--ink:#fff9ee;--muted:#e1d5ff;--tone:#693de2}.app[data-tone="teal"]{--bg:#20c9b9;--ink:#052e2d;--muted:#245858;--tone:#20c9b9}.app[data-tone="coral"]{--bg:#ff696d;--ink:#340d12;--muted:#6a3033;--tone:#ff696d}
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:2.6vh 4vw 1vh}.brand{font:800 clamp(17px,1.4vw,25px)/1 'Baloo 2',sans-serif;letter-spacing:.12em;text-transform:uppercase}.brand span{color:var(--yellow)}.round{font-weight:900;font-size:clamp(14px,1.3vw,22px);letter-spacing:.11em;text-transform:uppercase}.round-pill{border:2px solid currentColor;border-radius:99px;padding:.4em 1em}.scorebar{display:flex;gap:10px;align-items:center}.score{border:2px solid currentColor;border-radius:15px;padding:5px 15px;font-weight:900;font-size:clamp(14px,1.3vw,22px);white-space:nowrap}.score b{font-size:1.35em;margin-left:.4em}.scene{flex:1;display:flex;align-items:center;padding:1vh 4vw 2vh;min-height:0}.scene-inner{width:100%;max-width:1800px;margin:auto;animation:rise .38s both}@keyframes rise{from{opacity:.2;transform:translateY(16px)}to{opacity:1;transform:none}}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:clamp(16px,1.5vw,26px);margin-bottom:2vh}.cover h1,.end h1{font:800 clamp(75px,10vw,180px)/.86 'Baloo 2',sans-serif;letter-spacing:-.055em;margin:0}.cover h1 span{color:var(--yellow)}.cover p,.end p{font-size:clamp(24px,2.8vw,50px);font-weight:800;line-height:1.15;margin:3vh 0 0;max-width:1100px}.cover-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:5vh}.cover-grid div{border-radius:24px;background:var(--yellow);color:var(--deep);min-height:95px;display:grid;place-items:center;text-align:center;padding:16px;font-size:clamp(19px,2vw,35px);font-weight:900}.question-header{display:flex;align-items:center;justify-content:space-between;gap:20px}.question-header .round-pill{background:var(--ink);color:var(--tone);border:0}.timer{font:800 clamp(29px,3.8vw,66px)/1 'Baloo 2',sans-serif;min-width:2.8em;text-align:right;font-variant-numeric:tabular-nums}.timer.urgent{animation:pulse .7s infinite alternate}@keyframes pulse{to{opacity:.45;transform:scale(1.07)}}.question h2{font:800 clamp(53px,6.6vw,122px)/.94 'Baloo 2',sans-serif;letter-spacing:-.04em;margin:4vh 0 2.2vh}.question p{font-size:clamp(27px,2.8vw,50px);font-weight:800;line-height:1.18;margin:0;max-width:1600px;text-wrap:balance}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.7vw,28px);margin-top:4vh}.choice{border:3px solid transparent;background:var(--ink);color:var(--tone);border-radius:22px;padding:clamp(14px,1.6vw,28px);font:800 clamp(23px,2.5vw,47px)/1 'Baloo 2',sans-serif;min-height:82px;text-align:center;transition:transform .15s,box-shadow .15s}.choice:hover{transform:translateY(-4px)}.choice.active{border-color:var(--yellow);box-shadow:0 0 0 5px var(--deep),0 0 0 9px var(--yellow)}.choice .teams{display:block;margin-top:3px;font:900 clamp(12px,1vw,18px) Nunito,sans-serif;letter-spacing:.03em}.question-tip{font-size:clamp(16px,1.4vw,23px);font-weight:900;margin-top:2.6vh;opacity:.85}.decision{display:flex;gap:12px;flex-wrap:wrap;margin-top:2vh}.decision button{border:2px solid currentColor;border-radius:13px;background:transparent;color:var(--ink);padding:8px 14px;font-size:clamp(15px,1.2vw,20px);font-weight:900}.decision button.selected{background:var(--ink);color:var(--tone)}.decision .label{align-self:center;font-weight:900;font-size:clamp(15px,1.2vw,21px);min-width:4em}.panel{position:absolute;right:4vw;bottom:calc(7vh + 20px);z-index:5;display:none;max-width:420px;padding:20px;border-radius:22px;background:#140d37;color:#fff9ee;box-shadow:0 20px 70px #0008;border:2px solid #fff5}.panel.open{display:block}.panel h3{margin:0 0 8px;font:800 28px 'Baloo 2',sans-serif}.panel p{margin:0 0 15px;line-height:1.3}.award{display:flex;gap:8px}.award button,.panel .reset{flex:1;border:0;border-radius:11px;background:#ffd64f;color:#21134f;padding:9px 12px;font-weight:900}.panel .reset{width:100%;margin-top:12px;background:#ffffff20;color:#fff}.footer{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 4vw 2vh;border-top:1px solid currentColor}.controls{display:flex;gap:8px;flex-wrap:wrap}.control{border:2px solid currentColor;border-radius:12px;background:transparent;color:var(--ink);padding:7px 16px;font-size:clamp(14px,1.2vw,20px);font-weight:900}.control.primary{background:var(--yellow);color:var(--deep);border-color:var(--yellow)}.app[data-tone="yellow"] .control.primary{background:var(--deep);color:var(--yellow);border-color:var(--deep)}.control:disabled{opacity:.35;cursor:default}.hint{font-size:clamp(12px,1vw,18px);font-weight:800;opacity:.8;text-align:right}.end .handoff{display:inline-block;background:var(--yellow);color:var(--deep);border-radius:20px;padding:15px 28px;margin-top:5vh;font-size:clamp(22px,2vw,38px);font-weight:900}
@media(max-width:850px){body{overflow:auto}.app{height:auto;min-height:100dvh;overflow:visible}.top{flex-wrap:wrap}.scene{padding:40px 5vw}.cover-grid,.choices{grid-template-columns:1fr}.question h2{font-size:clamp(48px,12vw,95px)}.question p{font-size:clamp(24px,6vw,44px)}.footer{align-items:flex-start;flex-direction:column}.hint{text-align:left}.panel{position:fixed;bottom:10px;right:10px;left:10px;max-width:none}}@media(max-height:760px) and (min-width:851px){.question h2{font-size:clamp(45px,5vw,88px);margin:2vh 0}.question p{font-size:clamp(24px,2.2vw,38px)}.choices{margin-top:2vh}.choice{min-height:65px}.question-tip{margin-top:1vh}.decision{margin-top:1vh}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* O aviso de fim de tempo permanece visível; a pulsação chama atenção sem esconder a pergunta. */
.time-up{display:none;align-items:center;gap:14px;margin-top:3vh;padding:16px 24px;width:max-content;max-width:100%;border-radius:20px;background:#b91032;color:#fff;font:900 clamp(24px,3vw,52px)/1 'Baloo 2',sans-serif;letter-spacing:.06em;box-shadow:0 0 0 8px #fff5,0 12px 36px #5d001c66;animation:time-alert .75s ease-in-out infinite alternate}.time-up.visible{display:flex}.time-up .dot{width:18px;height:18px;flex:none;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff}@keyframes time-alert{from{background:#b91032;box-shadow:0 0 0 4px #fff5,0 12px 36px #5d001c66;transform:scale(1)}to{background:#f02c4e;box-shadow:0 0 0 12px #fff3,0 12px 45px #5d001c88;transform:scale(1.025)}}.timer.finished{color:#fff;animation:time-alert .75s ease-in-out infinite alternate;border-radius:14px;padding:0 10px}.app[data-tone="pink"] .timer.finished{color:#fff;background:#7d0028}
@media(prefers-reduced-motion:reduce){.time-up,.timer.finished{animation:none!important}}
</style></head><body><main class="app" id="app"><header class="top"><div class="brand">QUIZ DA CÉLULA <span>· FRUTO DO ESPÍRITO</span></div></header><section class="scene" id="scene" aria-live="polite"></section><footer class="footer"><div class="controls"><button class="control" id="prev">← Voltar</button><button class="control" id="timerBtn">Pausar tempo</button><button class="control" id="fullBtn">⛶ Tela cheia</button><button class="control primary" id="next">Avançar →</button></div><div class="hint">Setas: navegar · Espaço: pausar/continuar · F: tela cheia</div></footer></main>
<script>
const questions=[
 {tone:'yellow',title:'A mentira que salva',body:'Uma mulher foge de um marido violento e se esconde na sua casa. Ele bate à porta e pergunta onde ela está. Mentir é bondade?'},
 {tone:'blue',title:'O perdão que espera',body:'Alguém que te feriu nunca pediu perdão e nem sabe que errou. Fazer o bem a ela normalmente é bondade, ou impede que ela enxergue o erro?'},
 {tone:'orange',title:'O teste de José',body:'José testou os irmãos antes de se revelar. Dá para perdoar de coração e ainda assim testar?'},
 {tone:'green',title:'Cobrir ou expor?',body:'Alguém da igreja desviou dinheiro e te pede segredo, jurando que vai devolver. Calar é bondade ou cumplicidade?'},
 {tone:'pink',title:'A bondade que parece rejeição',body:'Uma irmã te procura em toda crise, sempre você e nunca Deus. Você se afasta de propósito para ela buscar o Senhor. É bondade?'},
 {tone:'purple',title:'Bondade e o corpo',body:'Uma irmã serve de coração, mas lidera mal o ministério. Tirá-la fere a pessoa; mantê-la prejudica a igreja. Qual é a bondade?'},
 {tone:'teal',title:'O fraco que você sustenta',body:'Você ajuda alguém em necessidade causada pelas próprias escolhas dela, e a sua ajuda mantém tudo como está. Parar é bondade ou abandono?'},
 {tone:'coral',title:'A dureza que cura',body:'Um irmão se orgulha de ser bondoso e paciente com todos, mas nunca disse uma palavra difícil a ninguém. Bondade que nunca confronta é bondade?'}
];
const app=document.getElementById('app'),scene=document.getElementById('scene');let index=0,seconds=30,running=false,ticker=null;
function render(){const q=questions[index-1];app.dataset.tone=q?.tone||'purple';document.getElementById('timerBtn').hidden=!q;document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===9?'Fim':'Avançar →';stopTimer();seconds=30;let html='';if(index===0){html=`<div class="scene-inner cover"><div class="eyebrow">DINÂMICA DE ABERTURA</div><h1>Bondade<br><span>ou boazinha?</span></h1><p>Dois times. Uma pergunta por vez. Nenhuma resposta fácil.</p><div class="cover-grid"><div>2 TIMES</div><div>30 SEGUNDOS POR PERGUNTA</div><div>DEFENDA SUA ESCOLHA</div></div></div>`}else if(index===9){html=`<div class="scene-inner end"><div class="eyebrow">FIM DO QUIZ</div><h1>A conversa<br>continua.</h1><p>O que chamou sua atenção nas escolhas de hoje?</p><div class="handoff">Agora vamos ouvir a Palavra.</div></div>`}else{html=`<div class="scene-inner question"><div class="question-header"><span class="round round-pill">PERGUNTA ${index} / 8</span><span class="timer" id="timer">0:30</span></div><h2>${q.title}</h2><p>${q.body}</p><div class="choices"><div class="choice">BONDADE</div><div class="choice">BOAZINHA</div><div class="choice">DEPENDE</div></div><div class="question-tip">Responda em voz alta e explique o porquê.</div><div class="time-up" id="timeUp" role="status"><span class="dot"></span>TEMPO ESGOTADO!</div></div>`}scene.innerHTML=html;if(q)startTimer()}
function stopTimer(){running=false;if(ticker){clearInterval(ticker);ticker=null}document.getElementById('timerBtn').textContent='Continuar tempo'}
function startTimer(){if(running||seconds===0)return;running=true;document.getElementById('timerBtn').textContent='Pausar tempo';ticker=setInterval(tick,1000)}
function tick(){seconds=Math.max(0,seconds-1);const el=document.getElementById('timer');if(el){el.textContent=`0:${String(seconds).padStart(2,'0')}`;el.classList.toggle('urgent',seconds<=5)}if(seconds===0){stopTimer();el.classList.add('finished');document.getElementById('timeUp').classList.add('visible');document.getElementById('timerBtn').textContent='Reiniciar 30 s'}}
function toggleTimer(){if(index<1||index>8)return;if(running){stopTimer()}else{if(seconds===0){seconds=30;const el=document.getElementById('timer');el.textContent='0:30';el.classList.remove('urgent','finished');document.getElementById('timeUp').classList.remove('visible')}startTimer()}}
function advance(n){index=Math.max(0,Math.min(9,index+n));render()}
document.getElementById('prev').onclick=()=>advance(-1);document.getElementById('next').onclick=()=>advance(1);document.getElementById('timerBtn').onclick=toggleTimer;document.getElementById('fullBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();advance(1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();advance(-1)}else if(e.key===' '){e.preventDefault();toggleTimer()}else if(e.key.toLowerCase()==='f')document.getElementById('fullBtn').click()});render();
</script></body></html>
